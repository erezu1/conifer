<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conifer bar balance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --fg: #16191d; --muted: #5a636e; --rule: #d3d9e0; --surface: #eff3f6;
  --accent: #1d5b98; --serif: "Newsreader", Georgia, serif; --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #0c0e11; --fg: #e3e6ea; --muted: #9ba4af; --rule: #2d343c; --surface: #171b20; --accent: #8db9ea; }
}
* { box-sizing: border-box; }
body { margin: 0; background: color-mix(in srgb, var(--surface) 60%, var(--bg)); color: var(--fg); font-family: var(--sans); }
h1 { font: 600 1.15rem var(--sans); margin: 1.6rem 16px .2rem; text-align: center; }
.lead { font: 400 .92rem/1.5 var(--sans); color: var(--muted); margin: 0 auto 1.6rem; max-width: 48rem; padding: 0 16px; text-align: center; }
section { max-width: 1120px; margin: 0 auto 2.4rem; padding: 0 16px; }
.name { font: 600 .82rem var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .2rem; }
.what { font: 400 .86rem/1.45 var(--sans); color: var(--muted); margin: 0 0 .8rem; max-width: 60rem; }
.pair { display: flex; flex-wrap: wrap; gap: 20px; }
.cell { width: 360px; max-width: 100%; }
.cap { font: 500 .78rem var(--sans); color: var(--muted); margin: 0 0 .35rem; }
.phone { background: var(--bg); border-radius: 18px; box-shadow: 0 8px 26px rgba(20, 30, 40, .12); overflow: hidden; }
.text { padding: 14px 18px 18px; font: 400 1rem/1.55 var(--serif); text-align: justify; hyphens: auto; }
.text p { margin: 0; }
.text .eq { text-align: center; font-style: italic; margin: .2rem 0 .7rem; }
mark { background: color-mix(in srgb, #f5c400 45%, transparent); color: inherit; border-radius: 2px; }

/* the bar */
.bar { position: relative; z-index: 1; padding: 8px 14px 0; border-bottom: 1px solid var(--rule); box-shadow: 0 8px 28px rgba(0, 0, 0, .10); }
.row { position: relative; display: flex; align-items: center; gap: 6px; height: 38px; }
.ic { width: 34px; height: 34px; display: grid; place-items: center; color: var(--accent); flex: none; }
.ic svg { width: 21px; height: 21px; }
.ic svg * { vector-effect: non-scaling-stroke; stroke-width: 1.25px; }
.title { flex: 1; min-width: 0; text-align: center; font: 500 .86rem var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title.axis { position: absolute; left: 50%; transform: translateX(-50%); width: 56%; flex: none; }
.spacer { flex: 1; }
.pill { border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .6rem; font: 500 .78rem var(--sans); color: var(--fg); white-space: nowrap; flex: none; }
.field { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; gap: .5rem; padding: 0 .1rem; color: var(--accent); }
.field svg { width: 17px; height: 17px; flex: none; }
.field svg * { vector-effect: non-scaling-stroke; stroke-width: 1.25px; }
.field input { flex: 1; min-width: 0; border: 0; background: none; font: 400 .95rem var(--sans); color: var(--fg); outline: none; padding: 0; }
.field .count { font: 500 .78rem var(--sans); color: var(--muted); white-space: nowrap; }
.field.blue { border-bottom: 1px solid var(--accent); }
.field.grey { border-bottom: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); }

/* the dial */
.dial { position: relative; display: flex; margin: 0 auto; transition: opacity .25s, height .25s; }
.dial span { flex: 1; text-align: center; padding: .3rem .2rem .25rem; font: 400 .74rem/1.2 var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.dial span.on { color: var(--accent); font-weight: 600; }
.dial svg { position: absolute; left: 0; bottom: 2px; width: 100%; height: 10px; overflow: visible; }
.dial line { vector-effect: non-scaling-stroke; stroke-width: 1.25px; stroke-linecap: round; }
.dial .track { stroke: color-mix(in srgb, var(--muted) 28%, transparent); }
.dial .lit { stroke: var(--accent); }
.dial circle { fill: color-mix(in srgb, var(--muted) 45%, transparent); }
.dial circle.on { fill: var(--accent); }
.dial.quiet span.on { color: var(--muted); }
.dial.quiet .lit { stroke: color-mix(in srgb, var(--muted) 55%, transparent); }
.dial.quiet circle.on { fill: color-mix(in srgb, var(--muted) 70%, transparent); }
.dial.gone { opacity: 0; height: 0 !important; overflow: hidden; }
/* spacing variants */
.even .row { margin-bottom: 10px; }
.even .dial { padding-bottom: 12px; height: 36px; }
.even.bar { padding-bottom: 10px; }
.now .row { margin-bottom: 6px; }
.now .dial { padding-bottom: 12px; height: 38px; }
.now.bar { padding-bottom: 8px; }
.note { font: 400 .8rem/1.45 var(--sans); color: var(--muted); margin: .5rem 0 0; }
</style>
</head>
<body>
<h1>The bar: balance and focus</h1>
<p class="lead">Each mockup shows the bar while reading and while searching, at phone width, in the reader's fonts, icons and colours. The rule tried in A and B: the bar shows one deep-blue line at a time, and it is the focus.</p>
<div id="out"></div>
<script>
(function () {
  const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M32 9V56"/><path d="M32 20L23 28M32 20L41 28M32 32L17.5 43M32 32L46.5 43M32 44L11 58M32 44L53 58"/></g><g fill="currentColor"><circle cx="32" cy="9" r="4"/><circle cx="32" cy="20" r="2.6"/><circle cx="23" cy="28" r="2.9"/><circle cx="41" cy="28" r="2.9"/><circle cx="32" cy="32" r="2.6"/><circle cx="17.5" cy="43" r="2.9"/><circle cx="46.5" cy="43" r="2.9"/><circle cx="32" cy="44" r="2.6"/><circle cx="11" cy="58" r="2.9"/><circle cx="53" cy="58" r="2.9"/></g></svg>';
  const FIND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  const SET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>';
  const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  const UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
  const DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  const TEXT = '<div class="text"><p class="eq">𝔼 H<sub>ij</sub>H<sub>kl</sub> = δ<sub>il</sub> δ<sub>jk</sub> / N.&nbsp;&nbsp;&nbsp;(2)</p><p>In particular 𝔼|H<sub>ij</sub>|² = 1/N for every pair <i>i, j</i>, the diagonal included; the <mark>semicircle</mark> follows from counting the pairings of a moment.</p></div>';
  const dial = cls => `<div class="dial ${cls || ''}"><span>Gist</span><span>Summary</span><span class="on">Paper</span><svg><line class="track"/><line class="lit"/><circle/><circle/><circle/></svg></div>`;
  const readRow = (axis, pill) => `<div class="row"><span class="ic">${LOGO}</span>${axis ? '<span class="spacer"></span>' : ''}<span class="title${axis ? ' axis' : ''}">2 Setup</span>${pill ? '<span class="pill">Physicist ▾</span>' : ''}<span class="ic">${FIND}</span><span class="ic">${SET}</span></div>`;
  const findRow = (blue) => `<div class="row"><span class="ic">${BACK}</span><label class="field ${blue ? 'blue' : 'blue'}">${FIND}<input value="semicircle" aria-label="Search"><span class="count">1 of 4</span></label><span class="ic">${UP}</span><span class="ic">${DOWN}</span></div>`;
  const cell = (cap, barHtml) => `<div class="cell"><p class="cap">${cap}</p><div class="phone">${barHtml}${TEXT}</div></div>`;
  const variants = [
    { name: 'Now', what: 'The title sits left of the axis (the right side is heavier); the Physicist pill is the only boxed, bold thing left; reading and searching each show two deep-blue lines, stacked.',
      read: `<div class="bar now">${readRow(false, true)}${dial()}</div>`, find: `<div class="bar now">${findRow(true)}${dial()}</div>` },
    { name: 'A. One blue line; the dial goes grey while searching', what: 'The title on the page’s axis, over the middle dot. No pill: who you read as stays one tap away in Settings. Even spacing above and below the dial. Searching, the dial keeps its place and goes grey, so the search line is the only blue.',
      read: `<div class="bar even">${readRow(true, false)}${dial()}</div>`, find: `<div class="bar even">${findRow(true)}${dial('quiet')}</div>` },
    { name: 'B. One blue line; the dial folds away while searching', what: 'As A while reading. Searching, the dial fades and folds away: the search row is the whole bar (the page below moves up a little, and back when the search closes).',
      read: `<div class="bar even">${readRow(true, false)}${dial()}</div>`, find: `<div class="bar even">${findRow(true)}${dial('gone')}</div>` },
  ];
  document.getElementById('out').innerHTML = variants.map(v => `<section><p class="name">${v.name}</p><p class="what">${v.what}</p><div class="pair">${cell('Reading', v.read)}${cell('Searching', v.find)}</div></section>`).join('');
  function place() {
    document.querySelectorAll('.dial').forEach(d => {
      const sp = [...d.querySelectorAll('span')], o = d.getBoundingClientRect();
      const mids = sp.map(s => { const r = s.getBoundingClientRect(); return r.left - o.left + r.width / 2; });
      const y = 5, svg = d.querySelector('svg'), t = svg.querySelector('.track'), l = svg.querySelector('.lit');
      [t, l].forEach(x => { x.setAttribute('x1', mids[0]); x.setAttribute('y1', y); x.setAttribute('y2', y); });
      t.setAttribute('x2', mids[2]); l.setAttribute('x2', mids[2]);
      [...svg.querySelectorAll('circle')].forEach((c, k) => { c.setAttribute('cx', mids[k]); c.setAttribute('cy', y); c.setAttribute('r', k === 2 ? 3.7 : 2.1); c.classList.add('on'); });
    });
  }
  place(); window.addEventListener('resize', place); document.fonts && document.fonts.ready.then(place);
})();
</script>
</body>
</html>
