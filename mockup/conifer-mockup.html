stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D467\" xlink:href=\"#MJX-TEX-I-1D467\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> at infinity. The discontinuity across the cut <mjx-container data-tex=\"[-2,2]\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.287ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"6.287ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 2778.7 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mo\"><use data-c=\"5B\" xlink:href=\"#MJX-TEX-N-5B\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(278,0)\"><use data-c=\"2212\" xlink:href=\"#MJX-TEX-N-2212\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(1056,0)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(1556,0)\"><use data-c=\"2C\" xlink:href=\"#MJX-TEX-N-2C\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(2000.7,0)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2500.7,0)\"><use data-c=\"5D\" xlink:href=\"#MJX-TEX-N-5D\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> gives back the density, <mjx-container data-tex=\"\\rho_{\\rm sc}(x) = -\\frac1\\pi\\operatorname{Im}G(x+i0)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:25.026ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.798ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"25.026ex\" height=\"2.755ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -864.9 11061.3 1217.7\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msub\"><g data-mml-node=\"mi\"><use data-c=\"1D70C\" xlink:href=\"#MJX-TEX-I-1D70C\"><\/use><\/g><g data-mml-node=\"TeXAtom\" transform=\"translate(550,-150) scale(0.707)\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><use data-c=\"73\" xlink:href=\"#MJX-TEX-N-73\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(394,0)\"><use data-c=\"63\" xlink:href=\"#MJX-TEX-N-63\"><\/use><\/g><\/g><\/g><g data-mml-node=\"mo\" transform=\"translate(1192.6,0)\"><use data-c=\"28\" xlink:href=\"#MJX-TEX-N-28\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(1581.6,0)\"><use data-c=\"1D465\" xlink:href=\"#MJX-TEX-I-1D465\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2153.6,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2820.3,0)\"><use data-c=\"3D\" xlink:href=\"#MJX-TEX-N-3D\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(3876.1,0)\"><use data-c=\"2212\" xlink:href=\"#MJX-TEX-N-2212\"><\/use><\/g><g data-mml-node=\"mfrac\" transform=\"translate(4654.1,0)\"><g data-mml-node=\"mn\" transform=\"translate(244.7,394) scale(0.707)\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"1D70B\" xlink:href=\"#MJX-TEX-I-1D70B\"><\/use><\/g><rect width=\"603.1\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g data-mml-node=\"mi\" transform=\"translate(5497.2,0)\"><use data-c=\"49\" xlink:href=\"#MJX-TEX-N-49\"><\/use><use data-c=\"6D\" xlink:href=\"#MJX-TEX-N-6D\" transform=\"translate(361,0)\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(6857.8,0)\"><use data-c=\"1D43A\" xlink:href=\"#MJX-TEX-I-1D43A\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(7643.8,0)\"><use data-c=\"28\" xlink:href=\"#MJX-TEX-N-28\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(8032.8,0)\"><use data-c=\"1D465\" xlink:href=\"#MJX-TEX-I-1D465\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(8827.1,0)\"><use data-c=\"2B\" xlink:href=\"#MJX-TEX-N-2B\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(9827.3,0)\"><use data-c=\"1D456\" xlink:href=\"#MJX-TEX-I-1D456\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(10172.3,0)\"><use data-c=\"30\" xlink:href=\"#MJX-TEX-N-30\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(10672.3,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>. This is the route of the Schwinger–Dyson, or self-consistent, derivation; <a class=\"secref\" href=\"#app-catalan\">Appendix A<\/a> relates it to the generating function of the Catalan numbers.<\/p>"}]}, {"id": "discussion", "kind": "section", "number": "5", "title": "Discussion", "role": "discussion", "gist": {"html": "The semicircle is universal beyond Gaussian entries; the genus expansion is the matrix-model–surface dictionary; the semicircle says nothing about level repulsion.", "status": "ai-approved"}, "brief": {"html": "<p><span data-covers=\"disc-p1\">Only the second moment of the entries was used, so the semicircle holds for any Wigner matrix, and for the real symmetric ensemble with corrections in <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/span> <span data-covers=\"disc-p2\">The sum over pairings by genus is the simplest form of the correspondence between matrix integrals and sums over surfaces, which JT gravity realises surface by surface.<\/span> <span data-covers=\"disc-p3\">The semicircle describes the density on the scale of the whole spectrum and is silent about level repulsion at separations of order <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/span><\/p>", "status": "ai-approved"}, "children": [{"id": "disc-p1", "kind": "paragraph", "role": "discussion", "gist": {"html": "Universality: any Wigner matrix gives the semicircle; the GOE has <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> corrections.", "status": "ai-approved"}, "body": "<p>Nothing in the argument used the Gaussian distribution beyond its second moment, once one knows that higher cumulants are suppressed. For a <dfn data-def=\"wigner\">Wigner matrix<\/dfn>, with independent entries, <mjx-container data-tex=\"\\mathbb E|H_{ij}|^2 = 1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:14.322ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"14.322ex\" height=\"2.552ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -833.9 6330.4 1128.2\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><use data-c=\"1D53C\" xlink:href=\"#MJX-TEX-D-1D53C\"><\/use><\/g><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(667,0)\"><g data-mml-node=\"mo\" transform=\"translate(0 -0.5)\"><use data-c=\"7C\" xlink:href=\"#MJX-TEX-N-7C\"><\/use><\/g><\/g><g data-mml-node=\"msub\" transform=\"translate(945,0)\"><g data-mml-node=\"mi\"><use data-c=\"1D43B\" xlink:href=\"#MJX-TEX-I-1D43B\"><\/use><\/g><g data-mml-node=\"TeXAtom\" transform=\"translate(864,-150) scale(0.707)\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mi\"><use data-c=\"1D456\" xlink:href=\"#MJX-TEX-I-1D456\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(345,0)\"><use data-c=\"1D457\" xlink:href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><g data-mml-node=\"msup\" transform=\"translate(2394.3,0)\"><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mo\" transform=\"translate(0 -0.5)\"><use data-c=\"7C\" xlink:href=\"#MJX-TEX-N-7C\"><\/use><\/g><\/g><g data-mml-node=\"mn\" transform=\"translate(311,363) scale(0.707)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><g data-mml-node=\"mo\" transform=\"translate(3386.6,0)\"><use data-c=\"3D\" xlink:href=\"#MJX-TEX-N-3D\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(4442.4,0)\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(4942.4,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(5442.4,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> and bounded higher moments, the same pairing terms give the leading contribution and the remaining terms are <mjx-container data-tex=\"O(1/N)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.758ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"7.758ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 3429 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><use data-c=\"1D442\" xlink:href=\"#MJX-TEX-I-1D442\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(763,0)\"><use data-c=\"28\" xlink:href=\"#MJX-TEX-N-28\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(1152,0)\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(1652,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(2152,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(3040,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>, so the semicircle law holds with the same proof <a class=\"cite\" href=\"#ref-agz\">[5]<\/a>. For the real symmetric (GOE) ensemble, the sum over pairings includes gluings that produce non-orientable surfaces, and the corrections come in powers of <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> rather than <mjx-container data-tex=\"1/N^2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.382ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"5.382ex\" height=\"2.452ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -833.9 2378.8 1083.9\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"msup\" transform=\"translate(1000,0)\"><g data-mml-node=\"mi\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(975.3,363) scale(0.707)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>; the leading term is unchanged.<\/p>"}, {"id": "disc-p2", "kind": "paragraph", "role": "discussion", "gist": {"html": "The genus expansion (6) is the matrix-model–surface dictionary realised by JT gravity.", "status": "ai-approved"}, "body": "<p>Equation <a class=\"eqref\" href=\"#eq-genus\">(6)<\/a> is the simplest instance of the correspondence between matrix integrals and sums over surfaces <a class=\"cite\" href=\"#ref-planar\">[4]<\/a>: the <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> expansion of a matrix integral is a topological expansion, each power <mjx-container data-tex=\"N^{-2g}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.127ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"5.127ex\" height=\"1.887ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -833.9 2266.2 833.9\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msup\"><g data-mml-node=\"mi\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><g data-mml-node=\"TeXAtom\" transform=\"translate(975.3,363) scale(0.707)\" data-mjx-texclass=\"ORD\"><g data-mml-node=\"mo\"><use data-c=\"2212\" xlink:href=\"#MJX-TEX-N-2212\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(778,0)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(1278,0)\"><use data-c=\"1D454\" xlink:href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> collecting the surfaces of genus <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1.079ex\" height=\"1.464ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -442 477 647\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><use data-c=\"1D454\" xlink:href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>. In JT gravity the double-scaled matrix integral reproduces the gravitational path integral surface by surface <a class=\"cite\" href=\"#ref-sss\">[6]<\/a>; the leading density of states there is not a semicircle but <mjx-container data-tex=\"\\rho_0(E)\\propto\\sinh(2\\pi\\sqrt E)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:20.539ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"20.539ex\" height=\"2.755ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -967.5 9078.1 1217.5\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msub\"><g data-mml-node=\"mi\"><use data-c=\"1D70C\" xlink:href=\"#MJX-TEX-I-1D70C\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(550,-150) scale(0.707)\"><use data-c=\"30\" xlink:href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><g data-mml-node=\"mo\" transform=\"translate(953.6,0)\"><use data-c=\"28\" xlink:href=\"#MJX-TEX-N-28\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(1342.6,0)\"><use data-c=\"1D438\" xlink:href=\"#MJX-TEX-I-1D438\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2106.6,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2773.3,0)\"><use data-c=\"221D\" xlink:href=\"#MJX-TEX-N-221D\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(3829.1,0)\"><use data-c=\"73\" xlink:href=\"#MJX-TEX-N-73\"><\/use><use data-c=\"69\" xlink:href=\"#MJX-TEX-N-69\" transform=\"translate(394,0)\"><\/use><use data-c=\"6E\" xlink:href=\"#MJX-TEX-N-6E\" transform=\"translate(672,0)\"><\/use><use data-c=\"68\" xlink:href=\"#MJX-TEX-N-68\" transform=\"translate(1228,0)\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(5613.1,0)\"><use data-c=\"2061\" xlink:href=\"#MJX-TEX-N-2061\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(5613.1,0)\"><use data-c=\"28\" xlink:href=\"#MJX-TEX-N-28\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(6002.1,0)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(6502.1,0)\"><use data-c=\"1D70B\" xlink:href=\"#MJX-TEX-I-1D70B\"><\/use><\/g><g data-mml-node=\"msqrt\" transform=\"translate(7072.1,0)\"><g transform=\"translate(853,0)\"><g data-mml-node=\"mi\"><use data-c=\"1D438\" xlink:href=\"#MJX-TEX-I-1D438\"><\/use><\/g><\/g><g data-mml-node=\"mo\" transform=\"translate(0,107.5)\"><use data-c=\"221A\" xlink:href=\"#MJX-TEX-N-221A\"><\/use><\/g><rect width=\"764\" height=\"60\" x=\"853\" y=\"847.5\"><\/rect><\/g><g data-mml-node=\"mo\" transform=\"translate(8689.1,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>, the edge of a spectrum shaped by a different potential, and the mechanism of <a class=\"secref\" href=\"#moments\">Section 3<\/a> is unchanged.<\/p>"}, {"id": "disc-p3", "kind": "paragraph", "role": "caveat", "gist": {"html": "What the semicircle does not say: nothing about correlations at scale <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>.", "status": "ai-approved"}, "body": "<p>The semicircle is a statement about the density on the scale of the whole spectrum. It says nothing about the correlations between neighbouring eigenvalues, at separations of order <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"4.271ex\" height=\"2.262ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -750 1888 1000\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"TeXAtom\" data-mjx-texclass=\"ORD\" transform=\"translate(500,0)\"><g data-mml-node=\"mo\"><use data-c=\"2F\" xlink:href=\"#MJX-TEX-N-2F\"><\/use><\/g><\/g><g data-mml-node=\"mi\" transform=\"translate(1000,0)\"><use data-c=\"1D441\" xlink:href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>, where random matrix theory makes its sharpest and most universal predictions: level repulsion, the sine kernel, the spectral form factor. Those require the joint distribution of the eigenvalues, <a class=\"eqref\" href=\"#eq-cov\">(2)<\/a> written in terms of the <mjx-container data-tex=\"\\lambda_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.059ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"2.059ex\" height=\"1.927ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -694 910 851.8\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"msub\"><g data-mml-node=\"mi\"><use data-c=\"1D706\" xlink:href=\"#MJX-TEX-I-1D706\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D456\" xlink:href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, and different tools, orthogonal polynomials or the resolvent at finite distance from the cut <a class=\"cite\" href=\"#ref-mehta\">[7]<\/a>.<\/p>"}]}, {"id": "app-catalan", "kind": "appendix", "number": "A", "title": "Catalan numbers", "fold": true, "gist": {"html": "Solving the Catalan recursion with a generating function, and its relation to the resolvent.", "status": "ai-approved"}, "brief": {"html": "<p><span data-covers=\"appA-p1\">The generating function of the recursion (7) satisfies <mjx-container data-tex=\"C = 1 + tC^2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:12.276ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"12.276ex\" height=\"2.072ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -833.9 5425.8 915.9\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><use data-c=\"1D436\" xlink:href=\"#MJX-TEX-I-1D436\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(1037.8,0)\"><use data-c=\"3D\" xlink:href=\"#MJX-TEX-N-3D\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(2093.6,0)\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2815.8,0)\"><use data-c=\"2B\" xlink:href=\"#MJX-TEX-N-2B\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(3816,0)\"><use data-c=\"1D461\" xlink:href=\"#MJX-TEX-I-1D461\"><\/use><\/g><g data-mml-node=\"msup\" transform=\"translate(4177,0)\"><g data-mml-node=\"mi\"><use data-c=\"1D436\" xlink:href=\"#MJX-TEX-I-1D436\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"32\" xlink:href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, so <mjx-container data-tex=\"C(t) = \\frac{1-\\sqrt{1-4t}}{2t}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:15.14ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.798ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"15.14ex\" height=\"3.263ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1089.5 6691.9 1442.3\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mi\"><use data-c=\"1D436\" xlink:href=\"#MJX-TEX-I-1D436\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(760,0)\"><use data-c=\"28\" xlink:href=\"#MJX-TEX-N-28\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(1149,0)\"><use data-c=\"1D461\" xlink:href=\"#MJX-TEX-I-1D461\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(1510,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(2176.8,0)\"><use data-c=\"3D\" xlink:href=\"#MJX-TEX-N-3D\"><\/use><\/g><g data-mml-node=\"mfrac\" transform=\"translate(3232.6,0)\"><g data-mml-node=\"mrow\" transform=\"translate(220,435.5) scale(0.707)\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(500,0)\"><use data-c=\"2212\" xlink:href=\"#MJX-TEX-N-2212\"><\/use><\/g><g data-mml-node=\"msqrt\" transform=\"translate(1278,0)\"><g transform=\"translate(853,0)\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(500,0)\"><use data-c=\"2212\" xlink:href=\"#MJX-TEX-N-2212\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(1278,0)\"><use data-c=\"34\" xlink:href=\"#MJX-TEX-N-34\"><\/use><\/g><g data-mml-node=\"mi\" transform=\"translate(1778,0)\"><use ><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(8357.4,0)\"><use data-c=\"21\" xlink:href=\"#MJX-TEX-N-21\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(8635.4,0)\"><use data-c=\"29\" xlink:href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> reproduces <mjx-container data-tex=\"1, 10, 70, \\dots\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.326ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"11.326ex\" height=\"1.968ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -676 5006 870\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(500,0)\"><use data-c=\"2C\" xlink:href=\"#MJX-TEX-N-2C\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(944.7,0)\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"><\/use><use data-c=\"30\" xlink:href=\"#MJX-TEX-N-30\" transform=\"translate(500,0)\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(1944.7,0)\"><use data-c=\"2C\" xlink:href=\"#MJX-TEX-N-2C\"><\/use><\/g><g data-mml-node=\"mn\" transform=\"translate(2389.3,0)\"><use data-c=\"37\" xlink:href=\"#MJX-TEX-N-37\"><\/use><use data-c=\"30\" xlink:href=\"#MJX-TEX-N-30\" transform=\"translate(500,0)\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(3389.3,0)\"><use data-c=\"2C\" xlink:href=\"#MJX-TEX-N-2C\"><\/use><\/g><g data-mml-node=\"mo\" transform=\"translate(3834,0)\"><use data-c=\"2026\" xlink:href=\"#MJX-TEX-N-2026\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>", "answeredBy": ["appB-p2"]}]}</script>
<script>
// Conifer viewer. The dial chooses which document is read (gist, summary, paper, everything); each is a clean linear
// text. A tap on something in the text opens a peek (a sheet) with the related material: the paragraphs a summary
// sentence stands for, a definition, a footnote, an equation. The peek's header is the link into the paper, and
// travelling leaves a way back. Inline expansion exists only for folds (appendices, proofs, background notes).
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const DOC = JSON.parse($('#conifer-doc').textContent);
  const LEVELS = DOC.levels;
  const IDX = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
  const GIST = IDX.gist ?? 0, BRIEF = IDX.brief ?? 1, SKIM = IDX.skim, PAPER = IDX.paper ?? LEVELS.length - 2, FULL = IDX.full ?? Infinity;      // (no tree declares an Everything level now: a fold opens by itself, never by depth)
  const LEVEL_HASH = LEVELS.map(l => ({ gist: 'gist', brief: 'summary', skim: 'skim', paper: 'paper', full: 'everything' })[l.key] || l.key);
  const BOX = { theorem: 'Theorem', definition: 'Definition', remark: 'Remark', proof: 'Proof', lemma: 'Lemma' };
  const HEADED = { references: 'References', footnotes: 'Footnotes', abstract: 'Abstract' };
  const titleOf = n => n.titleHtml || esc(n.title || '');
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------------ the index
  const byId = new Map(), parentOf = new Map();
  (function walk(n, p) { byId.set(n.id, n); parentOf.set(n.id, p); (n.children || []).forEach(c => walk(c, n.id)); })(DOC.root, null);
  const defs = new Map((DOC.defs || []).map(d => [d.id, d]));
  const qsAt = new Map();
  (DOC.questions || []).forEach(q => { const k = q.at.node; if (!qsAt.has(k)) qsAt.set(k, []); qsAt.get(k).push(q); });
  const descendants = id => { const out = []; (function w(n) { out.push(n.id); (n.children || []).forEach(w); })(byId.get(id)); return out; };
  const questionsUnder = id => descendants(id).flatMap(i => qsAt.get(i) || []);
  const ancestors = id => { const out = []; let p = parentOf.get(id); while (p) { out.unshift(p); p = parentOf.get(p); } return out; };
  const depth = id => ancestors(id).length;
  const titled = id => { let n = byId.get(id); while (n && !n.title) n = byId.get(parentOf.get(n.id)); return n; };
  const anchorHost = new Map();          // an id inside a body (equation, footnote, figure, reference) -> the node holding it
  byId.forEach(n => { if (n.body) for (const m of n.body.matchAll(/ id="([^"]+)"/g)) anchorHost.set(m[1], n.id); });
  const words = h => (String(h || '').replace(/<[^>]+>/g, ' ').match(/[A-Za-z0-9Ͱ-Ͽ][^\s]*/g) || []).length;
  const texText = t => String(t || '').replace(/\\(?:mathcal|mathbb|mathrm|text|textrm|bf|rm)\{([^}]*)\}/g, '$1').replace(/\\([A-Za-z]+)/g, '$1').replace(/[${}]/g, '');
  const shortLabel = n => !n ? '' : n.number ? (n.kind === 'appendix' ? 'App. ' : '§') + n.number : (n.title || n.id);
  function placeName(id) { const t = titled(id); if (!t) return id; return texText(t.number ? shortLabel(t) + ' ' + t.title : t.title); }
  function placeHtml(id) { const t = titled(id); if (!t) return esc(id); return (t.number ? esc(shortLabel(t)) + ' ' : '') + titleOf(t); }
  const isFold = n => !!n.fold || n.kind === 'background';

  // ------------------------------------------------------------------ the state
  const AUD = DOC.audiences || [];
  const state = { level: 0, over: new Map(), ledes: 'auto', chips: 'auto', theme: 'system',
    audience: (DOC.meta && DOC.meta.defaultAudience) || (AUD[0] && AUD[0].key) || '' };
  const audLabel = k => { const a = AUD.find(x => x.key === k); return a ? a.label : k; };
  const pick = t => (t && t.variants && t.variants[state.audience]) || t;
  const forMe = n => !n.audience || n.audience.includes(state.audience);
  const openByDefault = n => state.audience === 'student' && forMe(n);
  const skimHidden = () => SKIM !== undefined && state.audience === 'student';
  const ledesOn = () => state.ledes === true;                    // briefs are folded unless the reader opens them all
  const chipsOn = () => state.chips === true || (state.chips === 'auto' && state.audience !== 'specialist');
  function load() { try { const s = JSON.parse(localStorage.getItem('conifer-reader') || '{}'); ['ledes', 'chips', 'level', 'theme', 'audience'].forEach(k => { if (k in s && (k !== 'ledes' || s.lv === 2)) state[k] = s[k]; });
      if (!(state.level >= 0 && state.level < LEVELS.length)) state.level = Math.min(Math.max(+state.level || 0, 0), LEVELS.length - 1); } catch (e) {} }
  function save() { try { localStorage.setItem('conifer-reader', JSON.stringify({ lv: 2, level: state.level, ledes: state.ledes, chips: state.chips, theme: state.theme, audience: state.audience })); } catch (e) {} }
  function applyTheme() { const r = document.documentElement; if (state.theme === 'light' || state.theme === 'dark') r.dataset.theme = state.theme; else delete r.dataset.theme; }

  // terms: a mention of a defined term is a link only for the readers it is meant for
  const audienceDefs = html => html.replace(/<a data-def="([^"]+)">([\s\S]*?)<\/a>/g, (m, id, txt) => { const d = defs.get(id); return d && d.audience && !d.audience.includes(state.audience) ? txt : m; });

  // ------------------------------------------------------------------ rendering (HTML strings)
  function chip(t) {
    if (!chipsOn() || !t || !t.status) return '';
    const M = { author: ['author', 'Written by the author'], 'ai-approved': ['AI draft · approved', 'Drafted by the AI reader and checked by the author'], 'ai-draft': ['AI draft · unreviewed', 'Drafted by the AI reader; the author has not checked it yet'] };
    const m = M[t.status]; if (!m) return '';
    return `<span class="chip ${t.status}" title="${esc(m[1])}">${esc(m[0])}</span>`;
  }
  // a sentence of a summary and what it stands for: no mark in the text, a peek on a tap
  function withSpans(html, ctx) {
    if (ctx.plain) return html.replace(/<span data-covers="[^"]+">/g, '<span>');
    return html.replace(/<span data-covers="([^"]+)">/g, (m, c) => `<span class="gs" data-covers="${c}" role="button" tabindex="0" title="Show the part of the paper this stands for">`);
  }
  const stripIds = html => html.replace(/ id="([^"]*)"/g, ' id="peek-$1"');
  function qbadge(n, deep, ctx) {
    return '';
  }
  function qwords(id, deep) {
    const qs = deep ? questionsUnder(id) : (qsAt.get(id) || []);
    if (!qs.length) return '';
    return `<button type="button" class="qwords" data-q="${id}" data-deep="${deep ? 1 : 0}">${qs.length} question${qs.length > 1 ? 's' : ''}</button>`;
  }
  function qbadgeOld(n, deep, ctx) {
    if (ctx && ctx.prefix) return '';
    const qs = deep ? questionsUnder(n.id) : (qsAt.get(n.id) || []);
    if (!qs.length) return '';
    return `<button type="button" class="qbadge" data-q="${n.id}" data-deep="${deep ? 1 : 0}" title="Questions about this part" aria-label="${qs.length} question${qs.length > 1 ? 's' : ''} about this part">?<span>${qs.length}</span></button>`;
  }
  const circle = (act, key, open) => `<button type="button" class="fold-btn" data-act="toggle" data-key="${key}" title="${open ? 'Fold' : 'Open'}" aria-label="${open ? 'Fold' : 'Open'}" aria-expanded="${open}">${open ? '&minus;' : '+'}</button>`;

  // THE FOLD PATTERN (one for everything that folds: a section's brief, a background note, an appendix, a proof).
  // A fold is a head that never moves and a body under it. The head is the same whether the fold is open or closed:
  // a circled +/− at the left and the title beside it; the whole head is the control. Only the body eases open
  // (its grid track goes from nothing to its size, so nothing is measured or redrawn) and wears the fold's box (a
  // rule at the left for a note). The head is a heading when the fold is a section (an appendix, a brief's section).
  function secHead(n, ctx, lead, foldKey) {
    const hl = Math.min(1 + depth(n.id), 5);
    const anchor = ctx.prefix ? '' : `<button type="button" class="anchor" data-copy="${n.id}" title="Copy a link to this section" aria-label="Copy a link to this section">&#182;</button>`;
    return n.title ? `<h${hl} class="sec-h" data-node="${n.id}"${foldKey ? ` data-fold="${foldKey}"` : ''}>${lead}<span class="secnum">${esc(n.number || '')}</span>${n.number ? ' ' : ''}${titleOf(n)}${qbadge(n, false, ctx)}${anchor}</h${hl}>` : '';
  }
  function foldBlock(n, open, L, ctx) {

  function fontGlyph(font, c) {
    const k = c.charCodeAt(0), plain = hex(k), at = c <= '9' ? 2 : c < 'a' ? 0 : 1, base = FROM[font] && FROM[font][at];

    else if (base) codes.push(hex(base + off));
    if (font === 'boldsymbol' || font === 'bm') codes.push(hex(FROM.mathbf[at] + off));
    if (font === 'mathit' && at < 2) codes.push(hex((at ? 0x1D44E : 0x1D434) + off));
    return codes;
  }
  function glyphsOf(q) {                            // the glyphs q draws, in order; null when it has something this cannot tell
    const out = []; let i = 0, m, fontTo = -1, font = '';
    const groupEnd = from => { let d = 0, e = from; for (; e < q.length; e++) { if (q.charAt(e) === '{') d++; else if (q.charAt(e) === '}' && !--d) break; } return e; };
    while (i < q.length) {
      const c = q.charAt(i);
      if ((m = /^\\([A-Za-z]+|.)/.exec(q.slice(i)))) {
        const name = m[1]; i += m[0].length;
        if (FONTCMD.test(name)) {
          font = name === 'operatorname' ? 'mathrm' : name;
          fontTo = q.charAt(i) === '{' ? groupEnd(i) : i + 1;
          continue;
        }
        if (name === 'sqrt') {                      // a root is drawn with what is under it first, then the sign (then its index)
          let idx = '', body;
          if (q.charAt(i) === '[') { const cl = q.indexOf(']', i); if (cl < 0) return null; idx = q.slice(i + 1, cl); i = cl + 1; }
          if (q.charAt(i) === '{') { const e = groupEnd(i); body = q.slice(i + 1, e); i = e + 1; }
          else if ((m = /^(\\[A-Za-z]+|.)/.exec(q.slice(i)))) { body = m[1]; i += m[0].length; }

        }

        else if (OPNAME.test(name)) { for (const ch of name) out.push([hex(ch.charCodeAt(0))]); }

        continue;
      }

  }
  const ACC_C = /^(5E|7E|AF|2C9|2D9|A8|2C7|2D8|B4|60|2C6|2DC|20D7)$/;
  // the places q is drawn in a formula: each a run of its glyph elements; [] when none, null when q is not glyph-searchable
  function glyphRuns(f, q) {
    const qn = texNorm(q), seq = glyphsOf(qn);
    if (!seq) return null;
    const plainAcc = !HAS_ACC.test(qn), plainPrime = !/'|\\prime/.test(qn), single = seq.length === 1;
    const over = c => (plainAcc && ACC_C.test(c)) || (plainPrime && c === '2032');
    const gl = f.querySelectorAll('[data-c]'), all = Array.from(gl, g => g.getAttribute('data-c'));
    const idx = []; for (let k = 0; k < all.length; k++) if (single || !over(all[k])) idx.push(k);
    const codes = idx.map(k => all[k]), runs = [];

          for (let kk = 0; kk < left.length; kk++) if (left[kk][0] === '*' || left[kk].indexOf(codes[i + jj]) >= 0) { at = kk; break; }

        }
      }
      if (!ok) continue;
      runs.push(Array.prototype.slice.call(gl, idx[i], idx[i + seq.length - 1] + 1));
      i += seq.length - 1;
    }
    return runs;
  }
  // a soft box behind the given glyphs, drawn inside the formula's own picture (behind its glyphs, at least as tall as
  // the text round it), so it scrolls and scales with the formula
  function markGlyphs(f, gs) {
    try {
      const svg = f.querySelector('svg'); if (!svg) return null;
      let L = Infinity, T = Infinity, R = -Infinity, B = -Infinity;
      gs.forEach(g => { const r = g.getBoundingClientRect(); L = Math.min(L, r.left); T = Math.min(T, r.top); R = Math.max(R, r.right); B = Math.max(B, r.bottom); });
      if (!(R > L)) return null;
      const fs = parseFloat(getComputedStyle(f).fontSize) || 16, cy = (T + B) / 2, hh = Math.max(B - T + 2, fs * 1.05);
      T = cy - hh / 2; B = cy + hh / 2; L -= 2; R += 2;
      const M = svg.getScreenCTM().inverse(), pt = svg.createSVGPoint();
      pt.x = L; pt.y = T; const a = pt.matrixTransform(M);
      pt.x = R; pt.y = B; const b = pt.matrixTransform(M);
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('class', 'find-g');
      rect.setAttribute('x', a.x); rect.setAttribute('y', a.y); rect.setAttribute('width', b.x - a.x); rect.setAttribute('height', b.y - a.y);
      const rx = Math.min(b.x - a.x, b.y - a.y) * 0.18; rect.setAttribute('rx', rx); rect.setAttribute('ry', rx);

      return rect;
    } catch (e) { return null; }
  }

  // ------------------------------------------------------------------ finding
  let hits = [], at = -1, open = false, lastQ = '';
  const main = () => $('#paper');
  function textHits(q) {
    const out = [];
    const root = main(); if (!root) return out;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentNode.closest('mjx-container, .mjx-hl, .qbadge, .anchor, .fold-btn, button') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const parts = []; let text = '', node;
    while ((node = walker.nextNode())) { parts.push({ node, start: text.length }); text += node.nodeValue; }
    const hay = text.toLowerCase();
    const needle = q.toLowerCase().replace(/\s+/g, ' ');
    const at = pos => { let lo = 0, hi = parts.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (parts[mid].start <= pos) lo = mid; else hi = mid - 1; } return { node: parts[lo].node, off: pos - parts[lo].start }; };
    let i = hay.indexOf(needle);
    while (i >= 0 && out.length < 2000) {
      const a = at(i), b = at(i + needle.length);
      const r = document.createRange(); r.setStart(a.node, a.off); r.setEnd(b.node, b.off);
      out.push({ range: r, el: a.node.parentElement });
      i = hay.indexOf(needle, i + Math.max(1, needle.length));
    }
    return out;
  }
  function texHits(q) {
    const out = [], seq = glyphsOf(texNorm(q)), single = !!seq && seq.length === 1;
    $$('#paper mjx-container[data-tex]').forEach(f => {
      // a single symbol: wherever it is drawn (a paper's own macros for it too); more TeX: in formulas whose TeX has it
      if (!single && !texHas(f.dataset.tex, q)) return;
      const runs = seq ? glyphRuns(f, q) : null;
      if (runs && runs.length) runs.forEach(gs => out.push({ el: f, glyphs: gs }));
      else if (!single || texHas(f.dataset.tex, q)) out.push({ el: f });   // the formula as a whole
    });
    return out;
  }
  function order(list) {
    const pos = h => h.range ? h.range.startContainer : h.el;
    return list.sort((x, y) => { const a = pos(x), b = pos(y); if (a === b) return 0; return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1; });
  }
  function run(q) {
    clear();
    lastQ = q;
    const w = what(q);
    if (!w) { count(); return; }
    let list = [];
    if (w.mixed) {                                   // "the trace $\mathrm{Tr}\,\rho$ is": every text part, where a formula part is near
      w.mixed.forEach(p => { if (p.t) list = list.concat(textHits(p.t)); else list = list.concat(texHits(p.f)); });
    } else {
      if (w.text) list = list.concat(textHits(w.text));

    const c = $('#find-count'); if (!c) return;

    $$('#paper .find-f-now').forEach(f => f.classList.remove('find-f-now'));
    $$('#paper .find-g.now').forEach(g => g.classList.remove('now'));
    if (h.mark) h.mark.classList.add('now'); else if (!h.range) h.el.classList.add('find-f-now');
    const el = h.range ? (h.range.startContainer.nodeType === 3 ? h.range.startContainer.parentElement : h.range.startContainer) : h.el;
    const closed = el.closest && el.closest('.fold[data-state="closed"]'); if (closed && window.ConiferFolds) ConiferFolds.open(closed.dataset.key);
    const r = h.range ? h.range.getBoundingClientRect() : (h.mark || el).getBoundingClientRect();
    const bar = $('#bar'); const top = (bar ? bar.getBoundingClientRect().bottom : 0) + 12;
    if (r.top < top || r.bottom > window.innerHeight - 24) window.scrollTo({ top: window.scrollY + r.top - top - window.innerHeight * 0.3, behavior: first ? 'auto' : 'smooth' });
    count();
  }

  // ------------------------------------------------------------------ the field in the bar
  let timer = null;
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(on) {
    if (open === on) return;
    open = on;
    const row = $('#bar-row'), find = $('#find-row'); if (!row || !find) return;
    if (on) {
      row.hidden = true; find.hidden = false; find.classList.remove('closing'); find.classList.add('opening');
      const f = $('#find-input'); f.value = lastQ; f.focus(); f.select(); if (lastQ) run(lastQ);
    } else {
      clear(); count();
      const f = $('#find-input'); if (f && document.activeElement === f) f.blur();
      const done = () => { find.hidden = true; find.classList.remove('closing'); row.hidden = false; row.classList.add('opening'); setTimeout(() => row.classList.remove('opening'), 250); };
      if (reduced()) done(); else { find.classList.remove('opening'); find.classList.add('closing'); setTimeout(done, 170); }
    }

    open: () => show(true), close: () => show(false), toggle: () => show(!open), isOpen: () => open,
    refresh: () => { if (open && lastQ) run(lastQ); },

    if (e.target.id !== 'find-input') return;

  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); show(true); return; }   // Ctrl+F / Cmd+F is this search

    if (e.target.id === 'find-input' && e.key === 'Enter') { e.preventDefault(); go(at + (e.shiftKey ? -1 : 1)); }
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-find]'); if (!t) return;
    const a = t.dataset.find;
    if (a === 'open') show(true); else if (a === 'close') show(false); else if (a === 'next') go(at + 1); else if (a === 'prev') go(at - 1);

})();

// Conifer: copying, as Epsilon does it. A selection copied from the paper carries each formula as its TeX, $...$ in
// a line and \[...\] on a line of its own, with the paper's own macros written out so that it works anywhere; the
// standard physics and braket commands are left as they are. Nothing else about the text changes.
(function () {
  'use strict';
  const DOC = JSON.parse(document.getElementById('conifer-doc').textContent);
  const MACROS = (DOC.meta && DOC.meta.macros) || {};
  const names = Object.keys(MACROS).sort((a, b) => b.length - a.length);
  // a macro's body and how many arguments it takes, in MathJax's forms: "body" or ["body", n] or ["body", n, "default"]
  const defOf = n => { const m = MACROS[n]; return Array.isArray(m) ? { body: String(m[0]), n: +m[1] || 0, dflt: m[2] } : { body: String(m), n: 0 }; };
  function group(s, i) {                             // the brace group (or single token) starting at i: [text, end]
    while (i < s.length && /\s/.test(s[i])) i++;
    if (s[i] === '{') { let d = 0, j = i; for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}') { d--; if (!d) return [s.slice(i + 1, j), j + 1]; } } return [s.slice(i + 1), s.length]; }
    if (s[i] === '\\') { const m = /^\\([A-Za-z]+|.)/.exec(s.slice(i)); return [m[0], i + m[0].length]; }
    return [s[i] || '', i + 1];
  }
  function expand(tex) {
    if (!names.length) return tex;
    let s = tex;
    for (let pass = 0; pass < 12; pass++) {
      let changed = false, out = '', i = 0;
      while (i < s.length) {
        if (s[i] !== '\\') { out += s[i++]; continue; }
        const m = /^\\([A-Za-z]+)/.exec(s.slice(i));
        if (!m || !MACROS.hasOwnProperty(m[1])) { out += s[i]; i++; continue; }
        const d = defOf(m[1]); let j = i + m[0].length; const args = [];
        if (d.n) {
          let k = 0;
          if (d.dflt !== undefined) { if (/^\s*\[/.test(s.slice(j))) { const e = s.indexOf(']', j); args.push(s.slice(s.indexOf('[', j) + 1, e)); j = e + 1; } else args.push(d.dflt); k = 1; }
          for (; k < d.n; k++) { const g = group(s, j); args.push(g[0]); j = g[1]; }
        }
        out += d.body.replace(/#(\d)/g, (x, q) => args[+q - 1] !== undefined ? args[+q - 1] : x) + (/[A-Za-z]/.test(s[j] || '') && !d.n ? ' ' : '');
        i = j; changed = true;

  }

    if (node.nodeType === 3) return node.nodeValue;
    if (node.nodeType === 11) { let f = ''; node.childNodes.forEach(c => { f += textOf(c); }); return f; }
    if (node.nodeType !== 1) return '';
    if (node.tagName === 'MJX-CONTAINER') {
      const tex = expand(node.getAttribute('data-tex') || '').trim();
      return node.getAttribute('display') === 'true' ? '\n\\[ ' + tex + ' \\]\n' : '$' + tex + '$';
    }
    if (node.tagName === 'BR') return '\n';
    if (node.matches('.qbadge, .anchor, .fold-btn, .x-btn, .eqno, script, style')) return '';
    let t = '';
    node.childNodes.forEach(c => { t += textOf(c); });
    const block = /^(P|DIV|LI|H[1-6]|SECTION|FIGCAPTION|TR|BLOCKQUOTE|PRE|OL|UL|FIGURE)$/.test(node.tagName);
    return block ? t.replace(/\s+$/, '') + '\n\n' : t;
  }
  window.ConiferCopy = { expand, textOf };
  document.addEventListener('copy', e => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const within = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
    if (!within.closest('#paper, #sheet-body, #pop')) return;
    const frag = range.cloneContents();
    if (!frag.querySelector('mjx-container')) return;        // plain text copies as the browser does
    const text = textOf(frag).replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
  });
})();
